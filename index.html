<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy - Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="brand">Shop<span>Easy</span></div>

    <div class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="index.html#products">Products</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </div>

    <div style="display:flex; align-items:center; gap:8px;">
      <button class="icon-btn" id="themeToggle" title="Toggle theme">🌙</button>
      <button class="icon-btn" id="cartToggle" title="Cart">
        🛒
        <span class="cart-badge" id="cartBadge" style="display:none;">0</span>
      </button>
      <button class="hamburger" id="hamburger">☰</button>
    </div>
  </nav>

  <header class="hero">
    <h1>Welcome to ShopEasy</h1>
    <p>Discover quality products at affordable prices — all in one place.</p>
    <a class="shop-btn" href="#products">Shop Now</a>
  </header>

  <section id="products" class="products">
    <div class="products-head">
      <h2>Featured Products</h2>
      <div class="filters">
        <input type="text" id="searchBox" class="search-box" placeholder="Search products…">
        <select id="categoryFilter" class="category-select">
          <option value="all">All Categories</option>
        </select>
      </div>
    </div>

    <div class="product-grid" id="productGrid">
      <div class="empty-state">Loading products…</div>
    </div>
  </section>

  <footer>
    <p>© 2026 ShopEasy. Learning Project.</p>
  </footer>

  <!-- Cart Drawer -->
  <div class="overlay" id="cartOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3>Your Cart</h3>
      <button class="icon-btn" id="closeCart">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total</span>
        <span id="cartTotal">₹0</span>
      </div>
      <button id="checkoutBtn" style="width:100%;">Checkout</button>
    </div>
  </aside>

  <script type="module" src="app.js"></script>
  <script type="module" src="e-commerce.js"></script>
</body>
</html>
