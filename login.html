<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="brand">Shop<span>Easy</span></a>
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="icon-btn" id="themeToggle" title="Toggle theme">🌙</button>
    </div>
  </nav>

  <div class="auth-container">
    <h1>Welcome Back</h1>
    <p class="auth-subtitle">Login to continue shopping</p>

    <form id="loginForm">
      <input
        type="email"
        id="loginEmail"
        placeholder="Email"
        required
      >

      <div class="field">
        <input
          type="password"
          id="loginPassword"
          placeholder="Password"
          required
        >
        <button type="button" class="toggle-pw" data-target="loginPassword">Show</button>
      </div>

      <button type="submit" id="loginSubmit">Login</button>
    </form>

    <p id="loginMessage"></p>

    <p>
      Don't have an account?
      <a href="register.html">Register</a>
    </p>
  </div>

  <script type="module" src="app.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
