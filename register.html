<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy - Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="brand">Shop<span>Easy</span></a>
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="icon-btn" id="themeToggle" title="Toggle theme">🌙</button>
    </div>
  </nav>

  <div class="auth-container">
    <h1>Create Account</h1>
    <p class="auth-subtitle">Join ShopEasy in seconds</p>

    <form id="registerForm">
      <input
        type="text"
        id="name"
        placeholder="Full Name"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="Email"
        required
      >

      <div class="field">
        <input
          type="password"
          id="password"
          placeholder="Password (6+ characters)"
          minlength="6"
          required
        >
        <button type="button" class="toggle-pw" data-target="password">Show</button>
      </div>

      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <p class="strength-label" id="strengthLabel">Password strength</p>

      <button type="submit" id="registerSubmit">Register</button>
    </form>

    <p id="message"></p>

    <p>
      Already have an account?
      <a href="login.html">Login</a>
    </p>
  </div>

  <script type="module" src="app.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
